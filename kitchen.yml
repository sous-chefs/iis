---
driver:
  name: vagrant
  boot_timeout: 900
  customize:
    cpus: 2
    memory: 4096

transport:
  name: winrm
  elevated: true

provisioner:
  name: chef_infra
  policyfile_path: Policyfile.rb
  deprecations_as_errors: true
  product_name: chef
  channel: stable
  chef_license: accept

verifier:
  name: inspec

platforms:
  - name: windows-2016
    driver_config:
      box: tas50/windows_2016
  - name: windows-2019
    driver_config:
      box: tas50/windows_2019

suites:
  - name: default
    provisioner:
      named_run_list: default
      multiple_converge: 2
      enforce_idempotency: true
  - name: disable_default
    provisioner:
      named_run_list: disable_default
  - name: app
    provisioner:
      named_run_list: app
  - name: config_property
    provisioner:
      named_run_list: config_property
  - name: manager
    provisioner:
      named_run_list: manager
  - name: manager_permission
    provisioner:
      named_run_list: manager_permission
  - name: module
    provisioner:
      named_run_list: module
  - name: pool
    provisioner:
      named_run_list: pool
  - name: root
    provisioner:
      named_run_list: root
  - name: section
    provisioner:
      named_run_list: section
  - name: site
    provisioner:
      named_run_list: site
  - name: vdir
    provisioner:
      named_run_list: vdir
  - name: default_powershell
    provisioner:
      named_run_list: default_powershell
      multiple_converge: 2
      enforce_idempotency: true
    verifier:
      inspec_tests:
        - test/integration/default
  - name: site_powershell
    provisioner:
      named_run_list: site_powershell
    verifier:
      inspec_tests:
        - test/integration/site
